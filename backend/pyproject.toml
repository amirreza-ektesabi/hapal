[project]
name = "hapal-backend"
version = "0.1.0"
description = "Hapal API — Django backend"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "djoser>=2.3",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.7",
    "django-debug-toolbar>=5.2",
    "django-softdelete>=0.11.5",
    "psycopg[binary]>=3.2",
    "pillow>=11.3",
    "python-dotenv>=1.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3",
    "model-bakery>=1.20",
    "pytest>=8.3",
    "pytest-django>=4.11",
]
